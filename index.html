<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尋人小遊戲</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    /* 主頁 */
    #menu {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
    }

    .mode-btn {
        width: 200px;
        height: 100px;
        font-size: 28px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.2s;
    }

    .mode-btn:hover {
        transform: scale(1.05);
    }

    #normalBtn {
        background: #ffb347;
    }

    #bwBtn {
        background: #666;
        color: white;
    }

    /* 遊戲畫面 */
    #game {
        display: none;
        height: 100vh;
    }

    /* 左側資訊欄 */
    #sidebar {
        width: 250px;
        background: white;
        padding: 20px;
        box-sizing: border-box;
        border-right: 3px solid #ddd;
    }

    #targetImage {
        font-size: 80px;
        text-align: center;
    }

    #targetName {
        font-size: 32px;
        text-align: center;
        margin-top: 10px;
    }

    #targetColor {
        font-size: 24px;
        text-align: center;
        color: #666;
    }

    #score,
    #timer {
        margin-top: 30px;
        font-size: 28px;
        text-align: center;
    }

    /* 遊戲區 */
    #gameArea {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #fafafa;
    }

    /* 黑白模式 */
    .grayscale {
        filter: grayscale(100%);
    }

    /* 水果 */
    .fruit {
        position: absolute;
        font-size: 60px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s;
    }

    .fruit:hover {
        transform: scale(1.1);
    }
</style>
</head>

<body>

<!-- 主頁 -->
<div id="menu">
    <button class="mode-btn" id="normalBtn">普通</button>
    <button class="mode-btn" id="bwBtn">黑白模式</button>
</div>

<!-- 遊戲 -->
<div id="game">

    <!-- 左側 -->
    <div id="sidebar">
        <div id="targetImage">🍎</div>
        <div id="targetName">蘋果</div>
        <div id="targetColor">紅的</div>

        <div id="score">分數：0</div>
        <div id="timer">時間：60</div>
    </div>

    <!-- 遊戲區 -->
    <div id="gameArea"></div>

</div>

<script>

const fruits = [
    {
        emoji: "🍎",
        name: "蘋果",
        color: "紅的"
    },
    {
        emoji: "🍌",
        name: "香蕉",
        color: "黃的"
    },
    {
        emoji: "🍇",
        name: "葡萄",
        color: "紫的"
    },
    {
        emoji: "🍊",
        name: "橘子",
        color: "橘的"
    },
    {
        emoji: "🍓",
        name: "草莓",
        color: "紅的"
    }
];

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const gameArea = document.getElementById("gameArea");

const targetImage = document.getElementById("targetImage");
const targetName = document.getElementById("targetName");
const targetColor = document.getElementById("targetColor");

const scoreText = document.getElementById("score");
const timerText = document.getElementById("timer");

let targetFruit;
let score = 0;
let time = 60;
let timer;
let blackWhiteMode = false;

/* 開始遊戲 */
function startGame(isBlackWhite) {

    blackWhiteMode = isBlackWhite;

    menu.style.display = "none";
    game.style.display = "flex";

    if (blackWhiteMode) {
        gameArea.classList.add("grayscale");
    }

    createFruits();
    chooseTarget();

    timer = setInterval(() => {

        time--;
        timerText.innerText = `時間：${time}`;

        if (time <= 0) {
            clearInterval(timer);

            alert(`遊戲結束！\n你的分數：${score}`);

            location.reload();
        }

    }, 1000);
}

/* 隨機選目標 */
function chooseTarget() {

    targetFruit = fruits[Math.floor(Math.random() * fruits.length)];

    targetImage.innerText = targetFruit.emoji;
    targetName.innerText = targetFruit.name;
    targetColor.innerText = targetFruit.color;
}

/* 生成水果 */
function createFruits() {

    for (let i = 0; i < 25; i++) {

        const fruit = fruits[Math.floor(Math.random() * fruits.length)];

        const div = document.createElement("div");

        div.classList.add("fruit");
        div.innerText = fruit.emoji;

        const x = Math.random() * 900;
        const y = Math.random() * 600;
        const rotate = Math.random() * 360;

        div.style.left = `${x}px`;
        div.style.top = `${y}px`;
        div.style.transform = `rotate(${rotate}deg)`;

        /* 點擊 */
        div.addEventListener("click", () => {

            if (fruit.name === targetFruit.name) {

                score++;
                scoreText.innerText = `分數：${score}`;

                gameArea.innerHTML = "";

                createFruits();
                chooseTarget();

            } else {

                score--;

                if (score < 0) {
                    score = 0;
                }

                scoreText.innerText = `分數：${score}`;
            }

        });

        gameArea.appendChild(div);
    }
}

/* 按鈕 */
document.getElementById("normalBtn")
.addEventListener("click", () => {
    startGame(false);
});

document.getElementById("bwBtn")
.addEventListener("click", () => {
    startGame(true);
});

</script>

</body>
</html>
