<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>水果尋找遊戲 v2 - 完整隱藏版</title>
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:"Microsoft JhengHei",sans-serif;
background:linear-gradient(135deg,#ffe7c7,#ffd6e7);
overflow:hidden;
height: 100vh;
height: 100dvh; 
}
#menu{
height:100vh;height:100dvh;display:flex;flex-direction:column;
justify-content:center;align-items:center;gap:20px;
position: relative;
}
#title{font-size:52px;color:#ff6b81;margin:0}
.button-group{display:flex;gap:20px}
.mode-btn{
width:220px;height:90px;border:none;border-radius:20px;
font-size:28px;cursor:pointer;color:white;
}
#normalBtn{background:#ffb347}
#bwBtn{background:#666}

#game{
display:none;
width:100vw;
height:100vh;
height:100dvh;
flex-direction:row;
}
#sidebar{
width:280px;padding:20px;background:rgba(255,255,255,.95);
display:flex;flex-direction:column;align-items:center;gap:15px;
position:relative;
z-index:99;
box-shadow:2px 0 10px rgba(0,0,0,0.1);
}
#targetBox,.status-box{
background:white;border-radius:18px;padding:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
width:220px;text-align:center;
}
#targetImage{font-size:80px}
#targetName{font-size:32px;font-weight:bold}
.status-box{font-size:24px}
#notHereBtn{
width:220px;padding:14px;border:none;border-radius:16px;
background:#ff8fab;color:white;font-size:20px;cursor:pointer;
}

#gameArea{
flex:1;
display: grid;
gap: 1px;
padding: 15px; 
overflow: hidden;
background:rgba(255,255,255,.15);
align-content: center;
justify-content: center;
}
.grayscale{filter:grayscale(100%)}

.fruit-slot{
display: flex;
align-items: center;
justify-content: center;
width: 100%;
height: 100%;
overflow: visible;
}
.fruit{
font-size:36px;
cursor:pointer;
user-select:none;
z-index:5;
line-height:1;
display:inline-block;
}

#message{
position:fixed;
top:30px;left:50%;
transform:translateX(-50%);
background:rgba(255, 255, 255, 0.95);
color: #333;
font-size: 24px;
font-weight: bold;
padding: 15px 30px;
border-radius: 50px;
box-shadow: 0 4px 15px rgba(0,0,0,0.2);
display:none;
z-index:9999;
pointer-events: none;
}
.warning{color:red;font-weight:bold}

/* --- 隱藏內容物件樣式 --- */
#menuPaper {
position: absolute; left: 20px; bottom: 20px;
font-size: 45px; cursor: pointer; display: none; z-index: 10;
}
#menuComputer {
position: absolute; left: 80px; bottom: 20px;
font-size: 45px; display: none; cursor: pointer; z-index: 10;
}
#menuCorner {
position: absolute; right: 0; bottom: 0;
width: 40px; height: 40px;
background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.15) 50%);
cursor: pointer; display: none; z-index: 10;
}

/* 遮罩放大彈窗 */
#overlay {
position: fixed; top:0; left:0; width:100vw; height:100vh;
background: rgba(0,0,0,0.5); display: none;
justify-content: center; align-items: center; z-index: 1000;
}
#popupBox {
background: white; padding: 40px; border-radius: 20px;
box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center;
max-width: 80%; width: 400px;
}
#popupText { font-size: 26px; font-weight: bold; margin-bottom: 20px; color:#333; }
.popup-btn {
padding: 10px 25px; border: none; border-radius: 10px;
background: #ff8fab; color: white; font-size: 18px; cursor: pointer;
}

/* 劇情對話框樣式 */
#storyContainer {
position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
background: rgba(0,0,0,0.3); display: none;
justify-content: center; align-items: center; z-index: 2000;
}
#dialogueBox {
width: 450px; max-width: 90%; padding: 30px; border-radius: 20px;
box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-size: 20px;
font-weight: bold; position: relative; cursor: pointer;
animation: popIn 0.3s ease;
}
@keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 不同角色的對話框風格 */
.box-black { background: #222; color: #fff; border: 3px solid #444; }
.box-orange { background: #fffae8; color: #d35400; border: 3px solid #ffb347; margin-top: 40px; }
.box-white { background: #fff; color: #333; border: 3px solid #ccc; text-align: center; }

#dialogueName { font-size: 16px; margin-bottom: 8px; opacity: 0.8; }
#dialogueText { line-height: 1.5; min-height: 60px; }
#dialogueHint { font-size: 12px; text-align: right; opacity: 0.5; margin-top: 10px; }

/* 劇情選項群組 */
.options-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
.option-btn {
padding: 8px 20px; border: none; border-radius: 10px;
font-size: 16px; font-weight: bold; cursor: pointer;
}
.opt-orange { background: #ffb347; color: white; }
.opt-gray { background: #bbb; color: white; }

/* 電腦輸入介面 */
#computerInputBox { display: none; flex-direction: column; gap: 15px; margin-top: 15px; }
#pcInput { padding: 10px; font-size: 18px; text-align: center; border-radius: 8px; border: 2px solid #ccc; }

/* 資料夾刪除介面 */
#folderBox { display: none; flex-direction: column; align-items: center; gap: 15px; }
#fileIcon { font-size: 60px; cursor: pointer; user-select: none; transition: transform 0.2s; }
#fileIcon:active { transform: scale(0.9); }

/* 黑畫面與載入條 */
#blackScreen {
position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
background: black; display: none; flex-direction: column;
justify-content: center; align-items: center; z-index: 3000;
}
#loadingBarContainer {
width: 250px; height: 15px; background: #333;
border-radius: 10px; overflow: hidden; margin-top: 20px; display: none;
}
#loadingBar { width: 0%; height: 100%; background: #4cd137; transition: width 0.1s linear; }
#blackText { color: white; font-size: 22px; font-weight: bold; }

@media (max-width:900px) and (orientation:portrait){
    #game{ flex-direction:column; }
    #sidebar{ width:100%; height:auto; padding:10px; flex-direction:row; justify-content:space-around; flex-wrap:wrap; }
    #targetBox{ display:flex; align-items:center; gap:10px; width:auto; padding:5px 15px; }
    #targetImage{ font-size:35px }
    #targetName{ font-size:20px }
    .status-box, #notHereBtn{ width:auto; font-size:18px; margin:2px; padding:8px 15px; }
    #gameArea{ height: calc(100vh - 160px); height: calc(100dvh - 160px); gap: 1px; padding: 10px 10px 45px 10px; }
    .button-group{ flex-direction:column; }
    .fruit{ font-size:28px; }
    #title{ font-size:38px; text-align:center; }
}
</style>
</head>
<body style="position: relative;">

<div id="message"></div>

<!-- 遊戲主界面 -->

 </div>

 <div id="timer" class="status-box">時間：60</div>

 </div>
 <div id="gameArea"></div>
</div>

<!-- 開始選單界面 -->
<div id="menu">

 <div class="button-group">

 <div id="menuComputer">💻</div>

</div>

<!-- 彈出放大顯示層 -->
<div id="overlay">
 <div id="popupBox">
  <div id="popupText">紙上寫著：右下角</div>
  <button class="popup-btn" onclick="closeOverlay()">關閉</button>

<!-- 隱藏劇情文字大層 -->
<div id="storyContainer">

  <div id="choiceContainer" class="options-group"></div>

  <!-- 檔案刪除操作介面 -->
  <div id="folderBox">
   <div style="font-size:14px;color:#aaa;">【請長按下方文件圖示進行刪除】</div>
   <div id="fileIcon">📄</div>
  </div>

  <div id="dialogueHint">點擊任意空白處繼續...</div>
 </div>
</div>

<!-- 黑畫面與加載進度條 -->
<div id="blackScreen">
 <div id="blackText"></div>
 <div id="loadingBarContainer">
  <div id="loadingBar"></div>
 </div>
</div>
