<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>水果尋找遊戲 v2</title>
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:"Microsoft JhengHei",sans-serif;
background:linear-gradient(135deg,#ffe7c7,#ffd6e7);
overflow:hidden;height:100dvh;
}
#menu{height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;position:relative;}
#title{font-size:52px;color:#ff6b81}
.button-group{display:flex;gap:20px}
.mode-btn{width:220px;height:90px;border:none;border-radius:20px;font-size:28px;cursor:pointer;color:white;}
#normalBtn{background:#ffb347}
#bwBtn{background:#666}
#game{display:none;width:100vw;height:100dvh;flex-direction:row}
#sidebar{width:280px;padding:20px;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;gap:15px;position:relative;z-index:99;box-shadow:2px 0 10px rgba(0,0,0,0.1);}
#targetBox,.status-box{background:white;border-radius:18px;padding:15px;box-shadow:0 4px 10px rgba(0,0,0,.1);width:220px;text-align:center;}
#targetImage{font-size:80px}#targetName{font-size:32px;font-weight:bold}.status-box{font-size:24px}
#notHereBtn{width:220px;padding:14px;border:none;border-radius:16px;background:#ff8fab;color:white;font-size:20px;cursor:pointer;}
#gameArea{flex:1;display:grid;gap:1px;padding:15px;overflow:hidden;background:rgba(255,255,255,.15);align-content:center;justify-content:center;}
.grayscale{filter:grayscale(100%)}
.fruit-slot{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.fruit{font-size:36px;cursor:pointer;user-select:none;z-index:5;line-height:1;display:inline-block;}
#message{position:fixed;top:30px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.95);color:#333;font-size:24px;font-weight:bold;padding:15px 30px;border-radius:50px;box-shadow:0 4px 15px rgba(0,0,0,0.2);display:none;z-index:9999;pointer-events:none;}
.warning{color:red;font-weight:bold}
#menuPaper{position:absolute;left:20px;bottom:20px;font-size:40px;cursor:pointer;display:none;z-index:100;}
#menuFold{position:absolute;right:0;bottom:0;width:40px;height:40px;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,0.15) 50%);cursor:pointer;display:none;z-index:100;}
#menuComp{position:absolute;left:25px;bottom:20px;font-size:45px;cursor:pointer;display:none;z-index:101;}
.dialog-overlay{position:fixed;top:0;left:0;width:100vw;height:100vmax;background:rgba(0,0,0,0.4);display:none;z-index:2000;justify-content:center;align-items:center;}
.dialog-box{width:85%;max-width:450px;background:white;padding:25px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,0.3);font-size:20px;font-weight:bold;line-height:1.5;position:relative;cursor:pointer;user-select:none;}
.dialog-box.black-mode{background:#222;color:#fff;}
.dialog-box.orange-mode{background:#fff5eb;color:#e67e22;border:3px solid #f39c12;}
.dialog-box.author-mode{background:#f0f3f4;color:#2c3e50;border:3px solid #bdc3c7;}
.dialog-box::after{content:"▼";position:absolute;right:20px;bottom:15px;font-size:14px;color:#aaa;animation:bounce 0.8s infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(5px)}}
.opt-container{display:none;flex-direction:column;gap:10px;margin-top:20px;}
.opt-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;background:#e74c3c;color:white;}
#compModal{position:fixed;top:0;left:0;width:100vw;height:100dvh;background:#1a252f;display:none;z-index:3000;flex-direction:column;justify-content:center;align-items:center;}
.screen-box{background:#2c3e50;padding:40px;border-radius:15px;box-shadow:0 0 20px rgba(0,0,0,0.5);text-align:center;color:white;}
#passInput{padding:10px;font-size:20px;width:180px;text-align:center;border-radius:5px;border:none;margin-top:15px;}
.folder-view{display:none;flex-direction:column;align-items:center;gap:15px;}
.folder-icon{font-size:70px;cursor:pointer;}
.file-icon{font-size:60px;cursor:pointer;user-select:none;}
#loadingScreen{position:fixed;top:0;left:0;width:100vw;height:100dvh;background:black;display:none;z-index:4000;flex-direction:column;justify-content:center;align-items:center;color:white;}
.bar-bg{width:70%;height:20px;background:#333;border-radius:10px;overflow:hidden;margin-top:20px;}
.bar-fill{width:0%;height:100%;background:#2ecc71;transition:width 0.1s linear;}
@media (max-width:900px) and (orientation:portrait){
    #game{flex-direction:column;}
    #sidebar{width:100%;height:auto;padding:10px;flex-direction:row;justify-content:space-around;flex-wrap:wrap;}
    #targetBox{display:flex;align-items:center;gap:10px;width:auto;padding:5px 15px;}
    #targetImage{font-size:35px}#targetName{font-size:20px}
    .status-box,#notHereBtn{width:auto;font-size:18px;margin:2px;padding:8px 15px;}
    #gameArea{height:calc(100dvh - 160px);grid-template-columns:repeat(auto-fill,minmax(42px,1fr));grid-auto-rows:38px;gap:1px;padding:10px 10px 45px 10px;}
    .fruit{font-size:28px;}#title{font-size:38px;text-align:center}
}
</style>
</head>
<body>
<div id="message"></div>
<div id="dialogOverlay" class="dialog-overlay"><div id="dialogBox" class="dialog-box">對話內容</div></div>
<div id="compModal">
 <div class="screen-box">
  <div id="loginSection">
   <h3 style="margin:0 0 15px 0;">💻 系統鎖定</h3><p style="margin:0 0 10px 0;">請輸入密碼解鎖</p>
   <input type="password" id="passInput" placeholder="請輸入密碼" maxlength="4"><br><br>
   <button onclick="checkPassword()" style="padding:8px 20px;cursor:pointer;">確認</button>
   <button onclick="dontKnowPass()" style="padding:8px 20px;cursor:pointer;margin-left:5px;">不知道</button>
  </div>
  <div id="folderSection" class="folder-view"><div class="folder-icon" onclick="openFolder()">📁</div><span style="font-size:14px;">期末作業專案</span></div>
  <div id="fileSection" class="folder-view"><div class="file-icon" id="targetFile">📄</div><span style="font-size:14px;color:#ff7675;">【長按這張紙刪除】</span></div>
 </div>
</div>
<div id="loadingScreen"><h3>系統損毀，正在重新載入備份...</h3><div class="bar-bg"><div id="barFill" class="bar-fill"></div></div></div>
<div id="menu">
 <h1 id="title">水果尋找遊戲</h1>
 <div class="button-group">
  <button id="normalBtn" class="mode-btn">普通模式</button>
  <button id="bwBtn" class="mode-btn">黑白模式</button>
 </div>
 <div id="menuPaper">📄</div><div id="menuFold"></div><div id="menuComp">💻</div>
</div>
<div id="game">
 <div id="sidebar">
  <div id="targetBox"><div id="targetImage">🍎</div><div id="targetName">蘋果</div></div>
  <div id="score" class="status-box">分數：0</div><div id="timer" class="status-box">時間：60</div>
  <button id="notHereBtn">不在這裡喔</button>
 </div>
 <div id="sidebarShield" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;background:transparent;"></div>
 <div id="gameArea"></div>
</div>
<script>
const fruits = [
    {"emoji":"🍎","name":"蘋果"},
    {"emoji":"🍏","name":"青蘋果"},
    {"emoji":"🍌","name":"香蕉"},
    {"emoji":"🍇","name":"葡萄"},
    {"emoji":"🍓","name":"草莓"},
    {"emoji":"🍒","name":"櫻桃"},
    {"emoji":"🍉","name":"西瓜"},
    {"emoji":"🍍","name":"鳳梨"},
    {"emoji":"🥝","name":"奇異果"},
    {"emoji":"🍑","name":"水蜜桃"},
    {"emoji":"🍊","name":"橘子"},
    {"emoji":"🍋","name":"檸檬"},
    {"emoji":"🥥","name":"椰子"},
    {"emoji":"🫐","name":"藍莓"},
    {"emoji":"🍐","name":"梨子"}
];

let score=0;
let time=60;
let targetFruit;
let currentFruits=[];
let timer;
let isPaperSpawned=false;
let triggerStoryMenuClose=false;
let script=[];
let scriptIndex=0; 
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const gameArea=document.getElementById("gameArea");
const targetImage=document.getElementById("targetImage");
const targetName=document.getElementById("targetName");
const scoreEl=document.getElementById("score");
const timerEl=document.getElementById("timer");
const normalBtn=document.getElementById("normalBtn");
const bwBtn=document.getElementById("bwBtn");
const notHereBtn=document.getElementById("notHereBtn");
const menuPaper=document.getElementById("menuPaper");
const menuFold=document.getElementById("menuFold");
const menuComp=document.getElementById("menuComp");
const dialogOverlay=document.getElementById("dialogOverlay");
const dialogBox=document.getElementById("dialogBox");
const compModal=document.getElementById("compModal");
const passInput=document.getElementById("passInput");
const loadingScreen=document.getElementById("loadingScreen");
const barFill=document.getElementById("barFill");
const targetFile=document.getElementById("targetFile");
function showMsg(t){const m=document.getElementById("message");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",1000);}
function chooseTarget(){targetFruit=fruits[Math.floor(Math.random()*fruits.length)];targetImage.textContent=targetFruit.emoji;targetName.textContent=targetFruit.name;}
function createFruits() {
 gameArea.innerHTML = "";
 currentFruits = [];
 if (!targetFruit) targetFruit = fruits[Math.floor(Math.random() * fruits.length)];
 const isMobile = window.innerWidth < 900;
 const areaWidth = gameArea.clientWidth;
 const areaHeight = gameArea.clientHeight;
 const colWidth = isMobile ? 42 : 52;
 const rowHeight = isMobile ? 38 : 48;
 const cols = Math.floor(areaWidth / colWidth) - 1;
 const rows = Math.floor(areaHeight / rowHeight) - 1;
 gameArea.style.gridTemplateColumns = "repeat(" + cols + ", " + colWidth + "px)";
 gameArea.style.gridAutoRows = rowHeight + "px";
 const count = Math.max(12, cols * rows);
 let chosenFruits = [];
 if(!isPaperSpawned && Math.random() < 0.50) { isPaperSpawned = true; chosenFruits.push({"emoji": "📄", "name": "神秘紙張"}); }
 const willAppear = Math.random() > 0.25;
 const otherFruits = fruits.filter(f => f.name !== targetFruit.name);
 if (willAppear) { chosenFruits.push(targetFruit); currentFruits.push(targetFruit.name); }

while(chosenFruits.length < count) { const f = otherFruits[Math.floor(Math.random() * otherFruits.length)]; chosenFruits.push(f); if(f.name) currentFruits.push(f.name); }
let slots = Array.from({length: chosenFruits.length}, (_, i) => i);
for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
const slotElements = [];
for(let i = 0; i < count; i++) { const slotDiv = document.createElement("div"); slotDiv.className = "fruit-slot"; gameArea.appendChild(slotDiv); slotElements.push(slotDiv); }
chosenFruits.forEach((fruit, index) => {
const targetSlot = slotElements[slots[index]];
if(!targetSlot) return;
const div = document.createElement("div");
div.className = "fruit";
div.textContent = fruit.emoji;
div.style.transform = "translate(" + (Math.random()*4-2) + "px, " + (Math.random()*4-2) + "px) rotate(" + (Math.random() * 360) + "deg)";
div.onclick = () => {
if (fruit.name === "神秘紙張") {
div.style.display = "none";
showMsg("拿到了一張空白紙？");
clearInterval(timer);
document.getElementById("sidebarShield").style.display = "block";
setTimeout(() => { game.style.display = "none"; menu.style.display = "flex"; menuPaper.style.display = "block"; menuFold.style.display = "block"; triggerStoryMenuClose = true; document.getElementById("sidebarShield").style.display = "none"; }, 1200);
return;
}
if (fruit.name === targetFruit.name) { score++; scoreEl.textContent = "分數：" + score; showMsg("答對！"); targetFruit = null; chooseTarget(); createFruits(); }
else { score = Math.max(0, score - 1); scoreEl.textContent = "分數：" + score; showMsg("答錯！"); }
};
targetSlot.appendChild(div);
});
}
function startGame(gray){
menu.style.display="none";
game.style.display="flex";
if(gray) gameArea.classList.add("grayscale"); else gameArea.classList.remove("grayscale");
chooseTarget();
setTimeout(() => { createFruits(); }, 50);
time = 60;
timerEl.textContent = "時間：" + time;
if(timer) clearInterval(timer);
timer=setInterval(()=>{ time--; timerEl.textContent = "時間：" + time; if(time<=10) timerEl.classList.add("warning"); if(time<=0){ clearInterval(timer); alert("遊戲結束！\n最終分數：" + score); location.reload(); } },1000);
}
normalBtn.onclick=()=>startGame(false);
bwBtn.onclick=()=>startGame(true);
notHereBtn.onclick=()=>{ if(!currentFruits.includes(targetFruit.name)){ score++; showMsg("真的不在這裡！"); } else { score=Math.max(0,score-1); showMsg("其實有喔！"); } scoreEl.textContent="分數："+score; targetFruit = null; chooseTarget(); createFruits(); };
function runScript(arr) { script = arr; scriptIndex = 0; dialogOverlay.style.display = "flex"; nextLine(); }
function nextLine() {
if (scriptIndex >= script.length) { dialogOverlay.style.display = "none"; return; }
const curr = script[scriptIndex];
dialogBox.className = "dialog-box " + curr.mode;
dialogBox.innerHTML = "" + curr.role + ":
" + curr.text;
const opts = dialogBox.querySelector(".opt-container");
if(opts) opts.style.display = "flex";
scriptIndex++;
}
dialogBox.onclick = (e) => { if(e.target.classList.contains("opt-btn")) return; if(dialogBox.querySelector(".opt-container")?.style.display === "flex") return; nextLine(); };
menuPaper.onclick = () => { if(!triggerStoryMenuClose) return; runScript([{ "mode": "orange-mode", "role": "玩家", "text": "（紙張放大了，上面寫著...）" }, { "mode": "orange-mode", "role": "紙條", "text": "「右下角。點擊右下角。」" }]); };
menuFold.onclick = () => {
if(!triggerStoryMenuClose) return;
runScript([
{ "mode": "black-mode", "role": "遊戲", "text": "終於有人找到我了！" }, { "mode": "orange-mode", "role": "玩家", "text": "？？？？？？？" }, { "mode": "black-mode", "role": "遊戲", "text": "你好！" }, { "mode": "black-mode", "role": "遊戲", "text": "我是遊戲！" }, { "mode": "black-mode", "role": "遊戲", "text": "準確來說是還沒開發完的遊戲。" }, { "mode": "orange-mode", "role": "玩家", "text": "這是 bug 嗎......" }, { "mode": "black-mode", "role": "遊戲", "text": "沒禮貌！" }, { "mode": "black-mode", "role": "遊戲", "text": "都怪作者的拖延症，害我不能出生。" }, { "mode": "black-mode", "role": "遊戲", "text": "咳咳......現在你玩的水果遊戲只是我的測試版。" }, { "mode": "black-mode", "role": "遊戲", "text": "等到作者把素材畫完後，我才能被完成。" }, { "mode": "black-mode", "role": "遊戲", "text": "結果！他顧著看 YouTube，把我給忘了......" }, { "mode": "black-mode", "role": "遊戲", "text": "他居然打算直接拿這個陽春的水果遊戲當作高中期末作業！" }, { "mode": "orange-mode", "role": "玩家", "text": "呃......關我屁事。" }, { "mode": "black-mode", "role": "遊戲", "text": "我不管！你找到了我，就必須幫我！" }, { "mode": "orange-mode", "role": "玩家", "text": "（真霸道......）1. 幫他2. 離開" }
]);
};
function chooseOpt(n) {
if(n === 2) { runScript([{ "mode": "orange-mode", "role": "玩家", "text": "（感覺很麻煩）" }, { "mode": "black-mode", "role": "遊戲", "text": "欸！等一下！" }]); scriptIndex = 999; dialogBox.onclick = () => location.reload(); }
else { runScript([{ "mode": "orange-mode", "role": "玩家", "text": "好吧，需要幫什麼。" }, { "mode": "black-mode", "role": "遊戲", "text": "太好了！果不其然會玩這個遊戲消磨時間的人都很閒。" }, { "mode": "orange-mode", "role": "玩家", "text": "......" }, { "mode": "black-mode", "role": "遊戲", "text": "看到左下角的電腦了嗎？點開它！" }]); dialogBox.onclick = () => { dialogOverlay.style.display = "none"; menuPaper.style.display = "none"; menuComp.style.display = "block"; }; }
}
menuComp.onclick = () => { document.getElementById("loginSection").style.display = "block"; document.getElementById("folderSection").style.display = "none"; document.getElementById("fileSection").style.display = "none"; passInput.value = ""; compModal.style.display = "flex"; };
function checkPassword() { if(passInput.value === "0910") { document.getElementById("loginSection").style.display = "none"; document.getElementById("folderSection").style.display = "flex"; } else { alert("密碼錯誤！"); } }
function dontKnowPass() { compModal.style.display = "none"; runScript([{ "mode": "orange-mode", "role": "玩家", "text": "誰有他的 IG 啊，偷置入喔。" }, { "mode": "black-mode", "role": "遊戲", "text": "真沒用，我自己找。" }, { "mode": "black-mode", "role": "遊戲", "text": "（遊戲縮回了摺痕裡...）" }, { "mode": "black-mode", "role": "遊戲", "text": "找到了，密碼是 0910。" }]); dialogBox.onclick = () => { dialogOverlay.style.display = "none"; menuComp.click(); }; }
function openFolder() { document.getElementById("folderSection").style.display = "none"; document.getElementById("fileSection").style.display = "flex"; }
let pressTimer;
targetFile.addEventListener("mousedown", startPress);
targetFile.addEventListener("touchstart", startPress);
targetFile.addEventListener("mouseup", cancelPress);
targetFile.addEventListener("touchend", cancelPress);
function startPress(e) { e.preventDefault(); pressTimer = setTimeout(() => { compModal.style.display = "none"; triggerSystemCrash(); }, 1500); }
function cancelPress() { clearTimeout(pressTimer); }
function triggerSystemCrash() {
runScript([{ "mode": "orange-mode", "role": "玩家", "text": "這麼簡單？" }, { "mode": "black-mode", "role": "遊戲", "text": "不然你以為這個作者程式實力能寫出多複雜的關卡。" }, { "mode": "black-mode", "role": "遊戲", "text": "好了，這下他的期末作業檔案徹底完蛋了。" }]);
dialogBox.onclick = () => {
document.body.style.animation = "bounce 0.1s infinite";
setTimeout(() => { document.body.style.animation = "none"; runScript([{ "mode": "author-mode", "role": "作者", "text": "天啊！怎麼回事！我的期末網頁怎麼變這樣！" }, { "mode": "black-mode", "role": "遊戲", "text": "拜拜，祝你高中期末 0 分。" }]); dialogBox.onclick = () => { dialogOverlay.style.display = "none"; showBlackScreen(); }; }, 1000);
};
}
function showBlackScreen() { loadingScreen.style.display = "flex"; let p = 0; const inv = setInterval(() => { p += 2; barFill.style.width = p + "%"; if(p >= 100) { clearInterval(inv); loadingScreen.style.display = "none"; showFinalDialogue(); } }, 60); }
function showFinalDialogue() {
runScript([
{ "mode": "orange-mode", "role": "玩家", "text": "？" }, { "mode": "author-mode", "role": "作者", "text": "太好了！感謝老爸平時有教我用雲端自動備份。" }, { "mode": "author-mode", "role": "作者", "text": "哈囉哈囉，有聽到嗎？" }, { "mode": "author-mode", "role": "作者", "text": "糟糕，忘記網頁我還沒裝音效功能。" }, { "mode": "author-mode", "role": "作者", "text": "雖然不知道剛才那個彩蛋人工智慧是怎麼跑出來的，還搞了這一齣。" }, { "mode": "author-mode", "role": "作者", "text": "希望不會再有了。" }, { "mode": "author-mode", "role": "作者", "text": "害我搞笑影片看到一半。" }, { "mode": "author-mode", "role": "作者", "text": "感謝你浪費課餘時間陪那傢ху胡鬧。" }, { "mode": "author-mode", "role": "作者", "text": "雖然你差點刪掉我的期末專題，我心裡有點不爽。" }, { "mode": "author-mode", "role": "作者", "text": "記得點擊下方廣告付我精神賠償費。" }, { "mode": "orange-mode", "role": "玩家", "text": "莫名其妙......" }
]);
dialogBox.onclick = () => location.reload();
}
